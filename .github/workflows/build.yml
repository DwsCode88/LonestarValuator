name: Build Windows exe

# Every push to main builds the exe and publishes a release named after
# __version__ in valuator/__init__.py (bump it to ship an update).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["README.md", ".gitignore"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import valuator; print(valuator.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build
        run: pyinstaller LonestarValuator.spec --noconfirm --clean
      - name: Self-test packaged exe drives Chrome
        shell: pwsh
        run: |
          $p = Start-Process dist\LonestarValuator.exe -ArgumentList "--selftest","chrome" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Packaged exe could not drive Chrome (exit $($p.ExitCode))"; exit 1 }
          Write-Host "Packaged exe drove Chrome OK"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Lonestar Valuator v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/LonestarValuator.exe
